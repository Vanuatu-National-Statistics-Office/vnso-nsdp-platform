Proxy: 'No'
Definition: >-
  The "Proportion of Population with Access to Transport by Road, Sea, and Air"
  indicator measures the percentage of the population that has reliable and
  regular access to transportation services via road, sea, and air. This
  includes access to public and private transportation networks that connect
  communities to essential services, markets, and other destinations.
Concept: >-
  This indicator tracks the accessibility and availability of various modes of
  transportation within a population. Access to transport is a key component of
  economic development, social inclusion, and overall quality of life. The
  indicator considers the extent to which populations can use road networks,
  maritime routes, and air travel to meet their daily needs, engage in economic
  activities, and participate in social and cultural life. Reliable access
  implies that transportation services are consistently available, affordable,
  and safe.
Disaggregation: 'Transport Type, Region & Time Period'
Rationale: >-
  Monitoring the proportion of the population with access to transport by road,
  sea, and air is crucial for assessing the effectiveness of transportation
  infrastructure and services in meeting the needs of the population.
  Transportation is essential for connecting people to jobs, education,
  healthcare, and markets, thereby contributing to economic growth, social
  cohesion, and improved living standards. Lack of access to transport can lead
  to social isolation, limited economic opportunities, and reduced access to
  essential services.
MethodOfComputation: >
  To compute the "Proportion of Population with Access to Transport by Road,
  Sea, and Air," first collect data through surveys or censuses to determine the
  number of individuals or households with reliable access to each mode of
  transportation. Then, calculate the proportion by dividing this number by the
  total population or number of households surveyed, and multiply by 100 to
  express it as a percentage.


  ***Formula:***

  Proportion of Population with Access to Transport= Number of Households with
  Access to Transport/Total Households Surveyed)*100
SDGAlignment: '11.2.1 '
UnitOfMeasurement: Region
FrequencyOfCollection: Every 5-10 years
