page_content: >-
  The Ministry of Climate Change is currently working with the MOET last year
  and this year 2026 on the incorporation of Climate Change into syllabus across
  all levels of education. Currently, focus is tertiary education (Years 11 – 13
  & TVET). climate change and disaster risk reduction modules are incorporated
  on several subjects, noting being a cross-cutting issue. So far the progress
  is going in the right direction where 45% of public schools are introduce to 
  climate change and disaster risk reduction modules as part of their overall course works.
