national_geographical_coverage: Vanuatu
page_content: >-
  Since 2021, however, the trend has reversed significantly. The debt ratio
  declined sharply to approximately 40% in 2022, followed by further reductions
  to 39% in 2023 and 38% in 2024. This represents a reduction of approximately
  35 percentage points from the 2021 peak and a 25% reduction from the 2016
  baseline level. To achieve the 30% reduction target, the debt ratio would need
  to decline to approximately 35.7% of GDP by 2030. With the debt ratio already
  at approximately 38% in 2024, Vanuatu appears to be close to achieving the
  2030 target, requiring a further reduction of only about 2.3 percentage points
  over the remaining six years.
