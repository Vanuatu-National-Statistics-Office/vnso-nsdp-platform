page_content: >+
  In 2025, the Ministry of Climate Change, through the Department of Energy
  (DoE), continued to expand renewable energy generation across both
  grid-connected and mini-grid systems.157 solar sites with hybrid systems;
  ongoing installations (2024, Source: DoE), Wintua/Lorlow PV Mini grid and back
  up Generator set, Loltong Hybrid PV and Pico Hydro 46 Brantv community scale
  System, BRENWEI Hydropower station. Many systems are hybrid (renewable +
  diesel backup), meaning electricity is not yet 100% renewable National grid
  (especially urban centers) still includes diesel-based generation Lack of
  consolidated national data on actual % of renewable energy in total grid
  generation Data currently reflects installed systems, not actual generation
  share. 

